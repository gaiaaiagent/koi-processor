<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetary Regeneration Podcast - 3D Map (WebGPU)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0e1a;
            color: #ffffff;
            overflow: hidden;
        }

        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            gap: 15px;
        }

        #header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #4CAF50;
            margin-right: auto;
        }

        select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            min-width: 150px;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        #graph-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #audio-player {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 400px;
            max-height: 300px;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        #audio-player.active {
            display: flex;
        }

        #player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #player-episode-title {
            font-size: 14px;
            font-weight: 600;
            color: #4CAF50;
        }

        #player-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player-close:hover {
            color: #e0e0e0;
        }

        #player-text {
            font-size: 13px;
            color: #b0b0b0;
            max-height: 80px;
            overflow-y: auto;
            line-height: 1.5;
        }

        #player-text::-webkit-scrollbar {
            width: 6px;
        }

        #player-text::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        #player-text::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        audio {
            width: 100%;
            outline: none;
        }

        audio::-webkit-media-controls-panel {
            background: rgba(255, 255, 255, 0.1);
        }

        #player-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #player-controls label {
            font-size: 12px;
            color: #888;
        }

        #playback-speed {
            flex: 1;
            min-width: 80px;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #4CAF50;
            z-index: 2000;
        }

        #controls-hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            color: #888;
            max-width: 250px;
        }

        #controls-hint strong {
            color: #4CAF50;
            display: block;
            margin-bottom: 4px;
        }

        /* Chatbot Styles */
        #chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 400px;
            max-height: 600px;
            background: rgba(10, 14, 26, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 200;
            transition: all 0.3s ease;
        }

        #chatbot-container.minimized {
            max-height: 60px;
            overflow: hidden;
        }

        #chatbot-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        #chatbot-title {
            font-size: 16px;
            font-weight: 600;
            color: #4CAF50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #chatbot-controls {
            display: flex;
            gap: 8px;
        }

        #chatbot-controls button {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        #chatbot-controls button:hover {
            color: #e0e0e0;
            background: rgba(255, 255, 255, 0.05);
        }

        #chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
        }

        #chatbot-messages::-webkit-scrollbar {
            width: 6px;
        }

        #chatbot-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        #chatbot-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .chat-message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.user {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.3);
            align-self: flex-end;
            color: #e0e0e0;
        }

        .chat-message.assistant {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            color: #b0b0b0;
        }

        .chat-message.system {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.2);
            align-self: center;
            color: #ffc107;
            font-size: 13px;
            text-align: center;
        }

        .episode-links {
            padding: 12px;
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 8px;
            margin: 8px 0;
        }

        .episode-link {
            color: #4caf50;
            text-decoration: none;
            display: inline-block;
            padding: 4px 0;
            transition: color 0.2s;
        }

        .episode-link:hover {
            color: #66bb6a;
            text-decoration: underline;
            cursor: pointer;
        }

        #chatbot-input-container {
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 8px;
        }

        #chatbot-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
        }

        #chatbot-input:focus {
            outline: none;
            border-color: #4CAF50;
            background: rgba(255, 255, 255, 0.08);
        }

        #chatbot-send {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        #chatbot-send:hover {
            background: #45a049;
        }

        #chatbot-send:disabled {
            background: #666;
            cursor: not-allowed;
        }

        /* Mobile adjustments for chatbot */
        @media (max-width: 768px) {
            #chatbot-container {
                right: 0;
                left: 0;
                bottom: 0;
                width: 100%;
                max-height: 60vh;
                border-radius: 16px 16px 0 0;
            }

            #chatbot-container.minimized {
                max-height: 50px;
            }
        }

        /* Mobile Menu Toggle */
        #mobile-menu-toggle {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            margin-left: auto;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            #header {
                height: auto;
                flex-direction: column;
                padding: 12px 16px;
                gap: 10px;
            }

            #header h1 {
                font-size: 16px;
                margin-right: 0;
                order: 1;
            }

            #mobile-menu-toggle {
                display: block;
                position: absolute;
                top: 12px;
                right: 16px;
            }

            #header select {
                width: 100%;
                min-width: 0;
                order: 3;
                font-size: 13px;
            }

            #graph-container {
                top: auto;
            }

            #audio-player {
                left: 0;
                right: 0;
                bottom: 0;
                top: auto;
                width: 100%;
                max-height: 50vh;
                border-radius: 12px 12px 0 0;
                padding: 16px;
            }

            #player-episode-title {
                font-size: 13px;
            }

            #player-text {
                font-size: 12px;
                max-height: 60px;
            }

            #controls-hint {
                display: none;
            }
        }

        /* Tablet responsiveness */
        @media (max-width: 1024px) and (min-width: 769px) {
            #header {
                flex-wrap: wrap;
            }

            #header h1 {
                font-size: 17px;
            }

            select {
                min-width: 120px;
                font-size: 13px;
            }

            #audio-player {
                width: 350px;
            }
        }
    </style>
    <!-- Import Map for Three.js and WebGPURenderer -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.159.0",
                "three/addons/": "https://esm.sh/three@0.159.0/examples/jsm/",
                "three-forcegraph": "https://esm.sh/three-forcegraph@1.41.6?external=three"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Loading podcast map (WebGPU)...</div>

    <div id="header">
        <h1>🌍 Planetary Regeneration Podcast Map</h1>
        <select id="episode-selector">
            <option value="">All Episodes (67)</option>
        </select>
        <select id="cluster-selector">
            <option value="">All Topics</option>
        </select>
        <select id="cluster-level">
            <option value="1">1 Cluster</option>
            <option value="2">2 Clusters</option>
            <option value="3">3 Clusters</option>
            <option value="4">4 Clusters</option>
            <option value="5">5 Clusters</option>
            <option value="6">6 Clusters</option>
            <option value="7">7 Clusters</option>
            <option value="8">8 Clusters</option>
            <option value="9" selected>9 Clusters</option>
            <option value="10">10 Clusters</option>
            <option value="11">11 Clusters</option>
            <option value="12">12 Clusters</option>
            <option value="13">13 Clusters</option>
            <option value="14">14 Clusters</option>
            <option value="15">15 Clusters</option>
            <option value="16">16 Clusters</option>
            <option value="17">17 Clusters</option>
            <option value="18">18 Clusters</option>
        </select>
    </div>

    <div id="graph-container"></div>

    <div id="audio-player">
        <div id="player-header">
            <div id="player-episode-title">Episode Title</div>
            <button id="player-close">&times;</button>
        </div>
        <div id="player-text">Chunk text will appear here...</div>
        <audio id="audio-element" controls></audio>
        <div id="player-controls">
            <label for="playback-speed">Speed:</label>
            <select id="playback-speed">
                <option value="0.8">0.8x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="1.75">1.75x</option>
                <option value="2.0">2.0x</option>
                <option value="2.5">2.5x</option>
                <option value="3.0">3.0x</option>
            </select>
        </div>
    </div>

    <div id="controls-hint">
        <strong>Controls:</strong>
        Click nodes to play audio<br>
        Drag to rotate<br>
        Scroll to zoom<br>
        Right-click to pan
    </div>

    <!-- Chatbot -->
    <div id="chatbot-container">
        <div id="chatbot-header">
            <div id="chatbot-title">
                <span>🤖</span>
                <span>Podcast Q&A</span>
            </div>
            <div id="chatbot-controls">
                <button id="chatbot-minimize" title="Minimize">−</button>
            </div>
        </div>
        <div id="chatbot-messages">
            <div class="chat-message system">
                Ask me anything about the Planetary Regeneration Podcast!
            </div>
        </div>
        <div id="chatbot-input-container">
            <textarea id="chatbot-input" placeholder="Ask about the podcast..." rows="1"></textarea>
            <button id="chatbot-send">Send</button>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- We do NOT load 3d-force-graph here, we use three-forcegraph module in the main script -->

    <script>
        // Global Error Handler
        window.addEventListener('error', function(event) {
            console.error('Global Error:', event.message, event.error);
            const loadingEl = document.getElementById('loading');
            if (loadingEl) {
                loadingEl.innerHTML += `<br><span style="color:red; font-size:14px">Error: ${event.message || 'Resource loading failed'}</span>`;
            }
        }, true); // Capture phase to catch resource errors

        window.addEventListener('unhandledrejection', function(event) {
            console.error('Unhandled Rejection:', event.reason);
            const loadingEl = document.getElementById('loading');
            if (loadingEl) {
                loadingEl.innerHTML += `<br><span style="color:red; font-size:14px">Promise Error: ${event.reason}</span>`;
            }
        });

        // Timeout Fallback
        setTimeout(() => {
            const loadingEl = document.getElementById('loading');
            if (loadingEl && loadingEl.style.display !== 'none' && !loadingEl.textContent.includes('Error') && !loadingEl.textContent.includes('Done')) {
                loadingEl.innerHTML += `<br><span style="color:orange; font-size:14px">Warning: Loading is taking longer than expected. Check console for network errors.</span>`;
            }
        }, 8000);
    </script>

    <script type="module" crossorigin="anonymous" src="/static/podcast/podcast_map_webgpu.js?v=5"></script>

    <script>
        // Chatbot functionality
        const chatMessages = document.getElementById('chatbot-messages');
        const chatInput = document.getElementById('chatbot-input');
        const chatSend = document.getElementById('chatbot-send');
        const chatContainer = document.getElementById('chatbot-container');
        const chatMinimize = document.getElementById('chatbot-minimize');
        const chatHeader = document.getElementById('chatbot-header');

        let isMinimized = false;

        // Toggle minimize
        chatMinimize.addEventListener('click', (e) => {
            e.stopPropagation();
            isMinimized = !isMinimized;
            chatContainer.classList.toggle('minimized', isMinimized);
            chatMinimize.textContent = isMinimized ? '+' : '−';
        });

        // Click header to toggle
        chatHeader.addEventListener('click', () => {
            if (isMinimized) {
                chatMinimize.click();
            }
        });

        // Auto-resize textarea
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
        });

        // Send message
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            chatInput.value = '';
            chatInput.style.height = 'auto';
            chatSend.disabled = true;

            // Add thinking indicator
            const thinkingMsg = addMessage('Thinking...', 'system');

            try {
                // Call podcast chatbot API with LLM synthesis
                const response = await fetch('/api/podcast/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: message,
                        limit: 5
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Remove thinking indicator
                thinkingMsg.remove();

                // Format response - check if we got a synthesized answer
                if (data.synthesized && data.answer) {
                    addMessage(data.answer, 'assistant');

                    // Add clickable episode links if available
                    if (data.episodes && Object.keys(data.episodes).length > 0) {
                        const episodeListDiv = document.createElement('div');
                        episodeListDiv.className = 'episode-links';
                        episodeListDiv.innerHTML = '<strong>Relevant Episodes:</strong>';

                        for (const [title, episodeData] of Object.entries(data.episodes)) {
                            const link = document.createElement('a');
                            link.href = '#';
                            link.className = 'episode-link';
                            link.textContent = `▶ ${title}`;
                            link.onclick = (e) => {
                                e.preventDefault();
                                // Load episode data from the JSON
                                fetch('/static/podcast/podcast_map_3d.json')
                                    .then(res => res.json())
                                    .then(podcastData => {
                                        const episode = podcastData.episodes.find(ep => ep.episode_int_id === episodeData.episode_int_id);

                                        if (episode) {
                                            // Set the dropdown to this episode to trigger the full selection behavior
                                            const episodeSelector = document.getElementById('episode-selector');
                                            if (episodeSelector) {
                                                episodeSelector.value = episode.episode_id;
                                                // Trigger the change event to activate the episode selection
                                                episodeSelector.dispatchEvent(new Event('change'));
                                            }
                                        }
                                    });
                            };
                            episodeListDiv.appendChild(document.createElement('br'));
                            episodeListDiv.appendChild(link);
                        }

                        chatMessages.appendChild(episodeListDiv);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                } else if (data.results && data.results.length > 0) {
                    const answer = formatRAGResponse(data);
                    addMessage(answer, 'assistant');
                } else {
                    addMessage('I couldn\'t find relevant information about that in the podcast. Try asking something else!', 'assistant');
                }

            } catch (error) {
                console.error('Error:', error);
                thinkingMsg.remove();
                addMessage('Sorry, I encountered an error. Please try again.', 'system');
            } finally {
                chatSend.disabled = false;
            }
        }

        function formatRAGResponse(data) {
            const results = data.results.slice(0, 3);
            let response = `Based on the podcast, here's what I found:\n\n`;

            results.forEach((result, idx) => {
                const content = result.content;
                const truncated = content.length > 200 ? content.substring(0, 200) + '...' : content;
                response += `${idx + 1}. ${truncated}\n\n`;
            });

            response += `(Confidence: ${(data.confidence * 100).toFixed(0)}%)`;
            return response;
        }

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${type}`;

            // Simple markdown rendering for links
            if (type === 'assistant' && text.includes('[Listen here]')) {
                // Convert markdown links to HTML
                const htmlText = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" style="color: #4CAF50; text-decoration: underline;">$1</a>')
                    .replace(/\n/g, '<br>');
                messageDiv.innerHTML = htmlText;
            } else {
                // Handle line breaks
                messageDiv.innerHTML = text.replace(/\n/g, '<br>');
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        // Event listeners
        chatSend.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
