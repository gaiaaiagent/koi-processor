[pytest]
pythonpath = .
asyncio_mode = strict
addopts = -p no:deepeval

# Collect only from tests/, which is the only directory tests/conftest.py governs.
# Without this, a bare `pytest` also collected scripts/test_claims_api.py,
# scripts/terminusdb/test_*.py and src/.../test_entity_quality_filter.py — none of
# which any conftest.py reaches, so they ran with NO POSTGRES_URL redirect and NO
# live_graph_tripwire. scripts/test_claims_api.py writes claims to the live API.
#
# This narrows COLLECTION, not visibility: tests/test_live_write_governance.py
# scans the filesystem, so those files are still gated and still named in its
# allowlist. They remain runnable explicitly (`pytest scripts/...`,
# `python -m scripts.test_claims_api`). If that gate is ever removed, this line
# starts hiding things instead of governing them.
testpaths = tests
markers =
    integration: tests that require a running server
    core: core contract endpoint tests
    federation: KOI-net federation tests
    personal: personal-profile-only tests
    bkc: BKC-profile-only tests
    live: tests that call live OpenAI API (require OPENAI_API_KEY)
