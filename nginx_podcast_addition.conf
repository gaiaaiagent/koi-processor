# Add these location blocks to /etc/nginx/sites-available/regen-digests.conf
# Insert them BEFORE the final closing brace } of the server block

    # Podcast 3D Map
    location /podcast {
        proxy_pass http://127.0.0.1:8400/podcast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase buffer sizes for large JSON responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Podcast static files (JS, JSON)
    location /static/podcast {
        proxy_pass http://127.0.0.1:8400/static/podcast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

# After adding, run:
# sudo nginx -t              # Test config
# sudo systemctl reload nginx # Reload nginx
