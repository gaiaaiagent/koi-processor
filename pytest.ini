[pytest]
pythonpath = .
asyncio_mode = strict
addopts = -p no:deepeval
markers =
    integration: tests that require a running server
    core: core contract endpoint tests
    federation: KOI-net federation tests
    personal: personal-profile-only tests
    bkc: BKC-profile-only tests
    live: tests that call live OpenAI API (require OPENAI_API_KEY)
