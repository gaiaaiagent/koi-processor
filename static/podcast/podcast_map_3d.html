<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetary Regeneration Podcast - 3D Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0e1a;
            color: #ffffff;
            overflow: hidden;
        }

        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            gap: 15px;
        }

        #header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #4CAF50;
            margin-right: auto;
        }

        select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            min-width: 150px;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        #graph-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #audio-player {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 400px;
            max-height: 300px;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        #audio-player.active {
            display: flex;
        }

        #player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #player-episode-title {
            font-size: 14px;
            font-weight: 600;
            color: #4CAF50;
        }

        #player-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player-close:hover {
            color: #e0e0e0;
        }

        #player-text {
            font-size: 13px;
            color: #b0b0b0;
            max-height: 80px;
            overflow-y: auto;
            line-height: 1.5;
        }

        #player-text::-webkit-scrollbar {
            width: 6px;
        }

        #player-text::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        #player-text::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        audio {
            width: 100%;
            outline: none;
        }

        audio::-webkit-media-controls-panel {
            background: rgba(255, 255, 255, 0.1);
        }

        #player-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #player-controls label {
            font-size: 12px;
            color: #888;
        }

        #playback-speed {
            flex: 1;
            min-width: 80px;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #4CAF50;
            z-index: 2000;
        }

        #controls-hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            color: #888;
            max-width: 250px;
        }

        #controls-hint strong {
            color: #4CAF50;
            display: block;
            margin-bottom: 4px;
        }

        /* Mobile Menu Toggle */
        #mobile-menu-toggle {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            margin-left: auto;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            #header {
                height: auto;
                flex-direction: column;
                padding: 12px 16px;
                gap: 10px;
            }

            #header h1 {
                font-size: 16px;
                margin-right: 0;
                order: 1;
            }

            #mobile-menu-toggle {
                display: block;
                position: absolute;
                top: 12px;
                right: 16px;
            }

            #header select {
                width: 100%;
                min-width: 0;
                order: 3;
                font-size: 13px;
            }

            #graph-container {
                top: auto;
            }

            #audio-player {
                left: 0;
                right: 0;
                bottom: 0;
                top: auto;
                width: 100%;
                max-height: 50vh;
                border-radius: 12px 12px 0 0;
                padding: 16px;
            }

            #player-episode-title {
                font-size: 13px;
            }

            #player-text {
                font-size: 12px;
                max-height: 60px;
            }

            #controls-hint {
                display: none;
            }
        }

        /* Tablet responsiveness */
        @media (max-width: 1024px) and (min-width: 769px) {
            #header {
                flex-wrap: wrap;
            }

            #header h1 {
                font-size: 17px;
            }

            select {
                min-width: 120px;
                font-size: 13px;
            }

            #audio-player {
                width: 350px;
            }
        }
    </style>
</head>
<body>
    <div id="loading">Loading podcast map...</div>

    <div id="header">
        <h1>🌍 Planetary Regeneration Podcast Map</h1>
        <select id="episode-selector">
            <option value="">All Episodes (67)</option>
        </select>
        <select id="cluster-selector">
            <option value="">All Topics</option>
        </select>
        <select id="cluster-level">
            <option value="1">1 Cluster</option>
            <option value="2">2 Clusters</option>
            <option value="3">3 Clusters</option>
            <option value="4">4 Clusters</option>
            <option value="5">5 Clusters</option>
            <option value="6">6 Clusters</option>
            <option value="7">7 Clusters</option>
            <option value="8">8 Clusters</option>
            <option value="9" selected>9 Clusters</option>
            <option value="10">10 Clusters</option>
            <option value="11">11 Clusters</option>
            <option value="12">12 Clusters</option>
            <option value="13">13 Clusters</option>
            <option value="14">14 Clusters</option>
            <option value="15">15 Clusters</option>
            <option value="16">16 Clusters</option>
            <option value="17">17 Clusters</option>
            <option value="18">18 Clusters</option>
        </select>
    </div>

    <div id="graph-container"></div>

    <div id="audio-player">
        <div id="player-header">
            <div id="player-episode-title">Episode Title</div>
            <button id="player-close">&times;</button>
        </div>
        <div id="player-text">Chunk text will appear here...</div>
        <audio id="audio-element" controls></audio>
        <div id="player-controls">
            <label for="playback-speed">Speed:</label>
            <select id="playback-speed">
                <option value="0.8">0.8x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="1.75">1.75x</option>
                <option value="2.0">2.0x</option>
                <option value="2.5">2.5x</option>
                <option value="3.0">3.0x</option>
            </select>
        </div>
    </div>

    <div id="controls-hint">
        <strong>Controls:</strong>
        Click nodes to play audio<br>
        Drag to rotate<br>
        Scroll to zoom<br>
        Right-click to pan
    </div>

    <script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
    <script src="/static/podcast/podcast_map_3d.js?v=40"></script>
</body>
</html>
