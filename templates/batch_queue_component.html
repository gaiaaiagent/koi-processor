<!-- Batch Queue Component for integration into KOI Dashboard -->
<!-- This component is designed to be embedded within the existing dashboard -->

<div id="batch-queue-container" class="batch-queue-view">
    <style>
        .batch-queue-view {
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
        }

        .bq-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .bq-stat-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }

        .bq-stat-label {
            color: #6c757d;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .bq-stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #212529;
        }

        .bq-stat-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }

        .bq-badge-queued {
            background: #fff3cd;
            color: #856404;
        }

        .bq-badge-processing {
            background: #cfe2ff;
            color: #084298;
        }

        .bq-badge-completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .bq-actions {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .bq-button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .bq-btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .bq-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .bq-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .bq-btn-secondary {
            background: #e9ecef;
            color: #495057;
        }

        .bq-btn-secondary:hover {
            background: #dee2e6;
        }

        .bq-table-container {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #e9ecef;
            overflow-x: auto;
        }

        .bq-table {
            width: 100%;
            border-collapse: collapse;
        }

        .bq-table th {
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid #dee2e6;
            color: #6c757d;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bq-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #f1f3f5;
            color: #495057;
            font-size: 14px;
        }

        .bq-table tr:hover {
            background: #f8f9fa;
        }

        .bq-content-preview {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            color: #6c757d;
        }

        .bq-loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f4f6;
            border-radius: 50%;
            border-top-color: #667eea;
            animation: bq-spin 1s linear infinite;
            margin-left: 8px;
        }

        @keyframes bq-spin {
            to { transform: rotate(360deg); }
        }

        .bq-empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #adb5bd;
        }

        .bq-empty-icon {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: 20px;
        }

        .bq-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .bq-modal.active {
            display: flex;
        }

        .bq-modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .bq-modal-header h3 {
            margin: 0 0 8px 0;
            color: #212529;
        }

        .bq-form-group {
            margin-bottom: 20px;
        }

        .bq-form-group label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-weight: 600;
            font-size: 14px;
        }

        .bq-form-group input,
        .bq-form-group textarea,
        .bq-form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
        }

        .bq-form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .bq-cost-alert {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin: 16px 0;
            border-radius: 4px;
        }

        .bq-cost-value {
            font-size: 20px;
            font-weight: bold;
            color: #856404;
        }
    </style>

    <div class="bq-stats-grid">
        <div class="bq-stat-card">
            <div class="bq-stat-label">Queued Items</div>
            <div class="bq-stat-value" id="bq-queued-count">-</div>
            <span class="bq-stat-badge bq-badge-queued">Waiting</span>
        </div>
        <div class="bq-stat-card">
            <div class="bq-stat-label">Processing</div>
            <div class="bq-stat-value" id="bq-processing-count">-</div>
            <span class="bq-stat-badge bq-badge-processing">In Progress</span>
        </div>
        <div class="bq-stat-card">
            <div class="bq-stat-label">Completed</div>
            <div class="bq-stat-value" id="bq-completed-count">-</div>
            <span class="bq-stat-badge bq-badge-completed">Done</span>
        </div>
        <div class="bq-stat-card">
            <div class="bq-stat-label">Estimated Cost</div>
            <div class="bq-stat-value" id="bq-estimated-cost">$-</div>
            <span class="bq-stat-badge bq-badge-queued">GPT-4o-mini</span>
        </div>
    </div>

    <div class="bq-actions">
        <h4 style="margin-bottom: 16px; color: #212529;">Batch Processing Actions</h4>
        <div class="bq-button-group">
            <button class="bq-btn bq-btn-primary" onclick="BQ.showAddItemModal()">
                ➕ Add Item to Queue
            </button>
            <button class="bq-btn bq-btn-primary" onclick="BQ.processBatch()">
                🚀 Process Batch
            </button>
            <button class="bq-btn bq-btn-secondary" onclick="BQ.refreshStats()">
                🔄 Refresh Stats
            </button>
            <button class="bq-btn bq-btn-secondary" onclick="BQ.loadQueuedItems()">
                📋 View Queue
            </button>
            <button class="bq-btn bq-btn-secondary" onclick="BQ.loadResults()">
                ✅ View Results
            </button>
        </div>
    </div>

    <div class="bq-table-container">
        <h4 style="margin-bottom: 20px; color: #212529;">Queue Items</h4>
        <div id="bq-queue-content">
            <div class="bq-empty-state">
                <div class="bq-empty-icon">📦</div>
                <p>No items loaded. Click "View Queue" to load items.</p>
            </div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div id="bq-add-modal" class="bq-modal">
        <div class="bq-modal-content">
            <div class="bq-modal-header">
                <h3>Add Item to Queue</h3>
                <p style="color: #6c757d; margin: 0;">Add content for OpenAI GPT-4o-mini extraction</p>
            </div>
            <form id="bq-add-form">
                <div class="bq-form-group">
                    <label for="bq-rid">Resource ID (RID)</label>
                    <input type="text" id="bq-rid" name="rid" required placeholder="e.g., orn:koi:content:abc123">
                </div>
                <div class="bq-form-group">
                    <label for="bq-content">Content</label>
                    <textarea id="bq-content" name="content" required placeholder="Paste the content to be extracted..."></textarea>
                </div>
                <div class="bq-form-group">
                    <label for="bq-source-type">Source Type</label>
                    <select id="bq-source-type" name="source_type" required>
                        <option value="discourse">Discourse</option>
                        <option value="twitter">Twitter</option>
                        <option value="medium">Medium</option>
                        <option value="github">GitHub</option>
                        <option value="website">Website</option>
                        <option value="telegram">Telegram</option>
                        <option value="notion">Notion</option>
                        <option value="podcast">Podcast</option>
                    </select>
                </div>
                <div class="bq-form-group">
                    <label for="bq-metadata">Metadata (JSON, optional)</label>
                    <textarea id="bq-metadata" name="metadata" placeholder='{"author": "John Doe", "tags": ["regenerative", "finance"]}'></textarea>
                </div>
                <div class="bq-button-group">
                    <button type="submit" class="bq-btn bq-btn-primary">Add to Queue</button>
                    <button type="button" class="bq-btn bq-btn-secondary" onclick="BQ.hideModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Batch Queue Component JavaScript
const BQ = {
    API_BASE: 'http://localhost:8006',

    init() {
        this.refreshStats();
        setInterval(() => this.refreshStats(), 10000);
        this.setupEventListeners();
    },

    setupEventListeners() {
        document.getElementById('bq-add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            this.submitAddForm(e);
        });

        document.getElementById('bq-add-modal').addEventListener('click', (e) => {
            if (e.target.id === 'bq-add-modal') {
                this.hideModal();
            }
        });
    },

    async refreshStats() {
        try {
            const response = await fetch(`${this.API_BASE}/queue/stats`);
            const stats = await response.json();

            document.getElementById('bq-queued-count').textContent = stats.queued_count || 0;
            document.getElementById('bq-processing-count').textContent = stats.processing_count || 0;
            document.getElementById('bq-completed-count').textContent = stats.completed_count || 0;

            const cost = stats.estimated_cost || 0;
            document.getElementById('bq-estimated-cost').textContent = `$${cost.toFixed(4)}`;
        } catch (error) {
            console.error('Failed to fetch stats:', error);
        }
    },

    async loadQueuedItems() {
        try {
            const response = await fetch(`${this.API_BASE}/queue/items?limit=100`);
            const data = await response.json();
            const content = document.getElementById('bq-queue-content');

            if (!data.items || data.items.length === 0) {
                content.innerHTML = `
                    <div class="bq-empty-state">
                        <div class="bq-empty-icon">📦</div>
                        <p>No items in queue</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table class="bq-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>RID</th>
                            <th>Source</th>
                            <th>Content Preview</th>
                            <th>Est. Cost</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.items.forEach(item => {
                const cost = item.cost_estimate || 0;
                html += `
                    <tr>
                        <td>${item.id}</td>
                        <td style="font-family: monospace; font-size: 12px;">${item.rid}</td>
                        <td><span class="bq-stat-badge bq-badge-queued">${item.source_type}</span></td>
                        <td class="bq-content-preview">${item.content.substring(0, 100)}...</td>
                        <td>$${cost.toFixed(6)}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            content.innerHTML = html;
        } catch (error) {
            console.error('Failed to load queue items:', error);
        }
    },

    async loadResults() {
        try {
            const response = await fetch(`${this.API_BASE}/queue/results?limit=100`);
            const data = await response.json();
            const content = document.getElementById('bq-queue-content');

            if (!data.results || data.results.length === 0) {
                content.innerHTML = `
                    <div class="bq-empty-state">
                        <div class="bq-empty-icon">✅</div>
                        <p>No completed results available</p>
                    </div>
                `;
                return;
            }

            let html = `
                <h5 style="margin-bottom: 16px;">Completed Extractions</h5>
                <table class="bq-table">
                    <thead>
                        <tr>
                            <th>RID</th>
                            <th>Processed At</th>
                            <th>Entities</th>
                            <th>Summary</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.results.forEach(item => {
                const result = JSON.parse(item.result);
                const entities = result.entities ? result.entities.length : 0;
                const summary = result.summary || 'N/A';

                html += `
                    <tr>
                        <td style="font-family: monospace; font-size: 12px;">${item.rid}</td>
                        <td>${new Date(item.processed_at).toLocaleString()}</td>
                        <td>${entities} entities</td>
                        <td class="bq-content-preview">${summary}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            content.innerHTML = html;
        } catch (error) {
            console.error('Failed to load results:', error);
        }
    },

    async processBatch() {
        if (!confirm('Process batch? This will send up to 100 items to OpenAI GPT-4o-mini.')) {
            return;
        }

        const button = event.target;
        button.innerHTML = 'Processing... <span class="bq-loading"></span>';
        button.disabled = true;

        try {
            const response = await fetch(`${this.API_BASE}/queue/process-batch`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ max_items: 100 })
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const result = await response.json();
            alert(`Batch created: ${result.batch_id}\nItems: ${result.items_count}\nCost: $${result.total_cost_estimate.toFixed(4)}`);

            this.refreshStats();
            this.loadQueuedItems();
        } catch (error) {
            alert('Failed to process batch: ' + error.message);
        } finally {
            button.innerHTML = '🚀 Process Batch';
            button.disabled = false;
        }
    },

    showAddItemModal() {
        document.getElementById('bq-add-modal').classList.add('active');
    },

    hideModal() {
        document.getElementById('bq-add-modal').classList.remove('active');
        document.getElementById('bq-add-form').reset();
    },

    async submitAddForm(e) {
        const formData = new FormData(e.target);
        let metadata = {};

        if (formData.get('metadata')) {
            try {
                metadata = JSON.parse(formData.get('metadata'));
            } catch (err) {
                alert('Invalid JSON in metadata field');
                return;
            }
        }

        const data = {
            rid: formData.get('rid'),
            content: formData.get('content'),
            source_type: formData.get('source_type'),
            metadata: metadata
        };

        try {
            const response = await fetch(`${this.API_BASE}/queue/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const result = await response.json();
            alert(`Item added to queue (ID: ${result.queue_id})`);
            this.hideModal();
            this.refreshStats();
        } catch (error) {
            alert('Failed to add item to queue: ' + error.message);
        }
    }
};

// Initialize when component loads
document.addEventListener('DOMContentLoaded', () => {
    if (document.getElementById('batch-queue-container')) {
        BQ.init();
    }
});
</script>
